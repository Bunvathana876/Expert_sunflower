# Render Blueprint Specification for Sunflower Expert System Backend
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: expert-sunflower-api
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: starter
    healthCheckPath: /health/live
    envVars:
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: CSRF_REQUIRE_TOKEN
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_FAIL_CLOSED
        value: "false"
      - key: AI_ENABLED
        value: "false"
      - key: MEDIA_BACKEND
        value: local
      - key: MEDIA_ROOT
        value: /var/lib/sunflower/media
      - key: MEDIA_PUBLIC_URL
        value: /media
