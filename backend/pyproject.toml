[project]
name = "sunflower-api"
version = "0.1.0"
description = "Sunflower disease diagnosis expert system — API"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
  "asyncpg>=0.30",
  "psycopg[binary]>=3.2",          # sync driver, for Alembic
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyjwt[crypto]>=2.9.0",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.12",
  "pillow>=13.0",
  "structlog>=24.4",
  "email-validator>=2.2",
  "certifi>=2026.10.18",
  "dnspython>=2.9.0",
  "httpx>=0.27",                   # for Ollama API calls
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "aiosqlite>=0.20",
  "ruff>=0.7",
  "mypy>=1.13",
  "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "ai*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
  "build",
  "dist",
  "*.egg-info",
  ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"tests/integration/test_migrate_legacy.py" = ["E501", "E731"]
"scripts/**" = ["E402", "E501", "S108", "ASYNC230", "ASYNC240", "ASYNC250", "RUF001"]
"ai/**" = ["E501", "ASYNC109"]
"alembic/versions/**" = ["E501"]
"test_vision.py" = ["E501", "ASYNC230", "ASYNC240"]
"app/schemas/auth.py" = ["S105"]
"app/services/auth.py" = ["S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.vercel]
entrypoint = "app.main:app"
