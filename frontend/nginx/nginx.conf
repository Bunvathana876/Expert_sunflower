server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Match backend MEDIA_MAX_BYTES (5 MB) + multipart form overhead
    client_max_body_size 6m;

    # Enable gzip compression for text/JS/CSS/JSON/SVG payloads
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    include /etc/nginx/conf.d/security-headers.inc;

    # 1. Reverse proxy API routes on same origin (preserves SameSite=Lax HttpOnly cookies & CSRF)
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 180s;
    }

    # 2. Reverse proxy uploaded/disease media files
    location /media/ {
        proxy_pass http://api:8000/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Block public access to internal operational metrics endpoint
    location = /health/metrics {
        allow 127.0.0.1;
        allow ::1;
        allow 172.28.2.0/24;
        deny all;

        proxy_pass http://api:8000/health/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3.1. Reverse proxy operational liveness & readiness probes
    location /health {
        proxy_pass http://api:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Content-hashed Vite bundles: immutable 1-year CacheFirst browser caching
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 5. Service worker & PWA manifest: always revalidate while keeping bfcache eligibility
    location ~* ^/(sw\.js|workbox-.*\.js|registerSW\.js|manifest\.webmanifest)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # 6. SPA HTML entry & client-side routes: revalidate HTML (no-cache, not no-store, for bfcache)
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
